<body>
  <main id="root"></main>
  <script>
    // The publishable key is designed for browser use; row security is enforced in Postgres.
    const SUPABASE_URL = "https://flelfesnfxfstekfbplx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ykEXLut-tSoX9q4PXP1IWA_r01AfEuW";
    const API = SUPABASE_URL + "/rest/v1";
    let session = null, profile = null, leads = [], currentPage = "leads", contactLogs = [], clients = [], expenses = [], consents = [], templates = [], users = [];
    const root = document.getElementById("root");
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const safeUrl = value => { try { const u = new URL(value); return ["http:","https:"].includes(u.protocol) ? u.href : ""; } catch { return ""; } };
    const headers = extra => ({ apikey: SUPABASE_KEY, Authorization: "Bearer " + (session?.access_token || SUPABASE_KEY), "Content-Type":"application/json", ...extra });
    async function request(path, options={}) {
      const res = await fetch(API + path, { ...options, headers: headers(options.headers || {}) });
      const body = await res.text();
      let json; try { json = body ? JSON.parse(body) : null; } catch { json = body; }
      if (!res.ok) throw new Error(json?.message || json?.msg || "تعذر تنفيذ الطلب");
      return json;
    }
    function shellTop() { return '<header class="top"><div class="brand"><div class="mark">ت</div><div><div class="brand-name">تواصل</div><div class="brand-sub">نظام إدارة العملاء</div></div></div><div class="top-actions"><span class="pill">مساحة عمل خاصة</span><button class="btn ghost" id="logout">تسجيل الخروج</button></div></header>'; }
    function loginView(message="") {
      root.innerHTML='<div class="shell login-wrap"><section class="card login-card"><div class="brand"><div class="mark">ت</div><div><div class="brand-name">تواصل</div><div class="brand-sub">CRM للتواصل مع العملاء</div></div></div><h1>أهلاً بعودتك</h1><p class="subtitle">سجّل دخولك للوصول إلى قاعدة بيانات العملاء.</p><form id="loginForm" class="login-form"><div><label for="email">البريد الإلكتروني</label><input class="control" id="email" type="email" autocomplete="username" required placeholder="name@example.com"></div><div><label for="password">كلمة المرور</label><input class="control" id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div><div class="login-msg" id="loginMsg">'+esc(message)+'</div><button class="btn" id="loginBtn" type="submit">تسجيل الدخول</button></form><div class="fine">هذه المنصة خاصة بفريقك. يحدد مدير النظام صلاحيات الحسابات.</div></section></div>';
      document.getElementById("loginForm").addEventListener("submit", signIn);
    }
    async function signIn(e) {
      e.preventDefault(); const btn=document.getElementById("loginBtn"), msg=document.getElementById("loginMsg");
      btn.disabled=true; btn.textContent="جارٍ تسجيل الدخول…"; msg.textContent="";
      try {
        const res=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
        const data=await res.json(); if(!res.ok) throw new Error(data.msg||data.message||"بيانات الدخول غير صحيحة");
        session=data; sessionStorage.setItem("tawasol_session",JSON.stringify(data)); await startApp();
      } catch(err) { msg.textContent=err.message; btn.disabled=false; btn.textContent="تسجيل الدخول"; }
    }
    function logout(){ session=null;profile=null;leads=[];sessionStorage.removeItem("tawasol_session");loginView(); }
    async function startApp() {
      try {
        profile=await request("/profiles?select=role,email&id=eq."+encodeURIComponent(session.user.id)+"&limit=1");
        profile=profile?.[0]; if(!profile) throw new Error("لم يتم العثور على صلاحيات الحساب. تواصل مع مدير النظام.");
        await loadLeads(); renderApp();
      } catch(err) { logout(); loginView(err.message); }
    }
    async function loadLeads() { leads=await request("/leads?select=*&order=name.asc&limit=1000") || []; }
    function unique(key){return [...new Set(leads.map(x=>x[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));}
    function optionList(values,label){return '<option value="">'+label+'</option>'+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");}
    function renderApp() {
      const editable=["admin","manager"].includes(profile.role);
      const pages=[ ["leads","الأنشطة"], ["contacts","سجل التواصل"], ["clients","العملاء"], ["expenses","المصروفات"], ["whatsapp","خلك على تواصل"] ];
      if(profile.role==="admin") pages.push(["admin","الإدارة"]);
      root.innerHTML='<div class="shell">'+shellTop()+
        '<section class="hero"><div><div class="eyebrow">إدارة علاقات العملاء</div><h1>كل تواصلك، في مكان واحد</h1><p class="subtitle">نظّم أنشطتك وعملاءك ومتابعاتك في مساحة عمل واحدة.</p></div><span class="pill">مرحباً، '+esc(profile.email||session.user.email)+' · '+(profile.role==="admin"?"مدير":profile.role==="manager"?"مدير بيانات":"مستخدم")+'</span></section>'+
        '<nav class="nav">'+pages.map(([id,label])=>'<button type="button" data-page="'+id+'" class="'+(currentPage===id?"active":"")+'">'+label+'</button>').join("")+'</nav>'+pageContent(editable)+'</div>';
      document.getElementById("logout").onclick=logout;
      root.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>openPage(b.dataset.page));
      if(currentPage==="leads"){
        for(const id of ["q","category","region","district"]) document.getElementById(id).addEventListener("input",drawTable);
        document.getElementById("clear").onclick=()=>{for(const id of ["q","category","region","district"])document.getElementById(id).value="";drawTable();};
        document.getElementById("csv")?.addEventListener("change",uploadCsv); drawTable();
      }
      root.querySelector("#contactForm")?.addEventListener("submit",saveContact);
      root.querySelector("#clientForm")?.addEventListener("submit",saveClient);
      root.querySelector("#expenseForm")?.addEventListener("submit",saveExpense);
      root.querySelector("#consentForm")?.addEventListener("submit",saveConsent);
      root.querySelector("#templateForm")?.addEventListener("submit",saveTemplate);
      root.querySelectorAll("[data-role]").forEach(s=>s.onchange=()=>changeRole(s.dataset.role,s.value));
      root.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=()=>revokeConsent(b.dataset.revoke));
      root.querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>openWhatsApp(b.dataset.send,b.dataset.template));
    }
    function formField(label,name,type="text",required=true,wide=false){return '<div class="field '+(wide?"wide":"")+'"><label for="'+name+'">'+label+'</label><input class="control" id="'+name+'" name="'+name+'" type="'+type+'" '+(required?"required":"")+'></div>';}
    function leadOptions(){return '<option value="">بدون ربط بنشاط</option>'+leads.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+(x.phone?" · "+esc(x.phone):"")+'</option>').join("");}
    function pageContent(editable){
      if(currentPage==="leads") return '<section class="card filters"><div class="field search"><label for="q">بحث سريع</label><input id="q" class="control" placeholder="اسم النشاط أو رقم الهاتف"></div><div class="field"><label for="category">المجال</label><select id="category" class="control">'+optionList(unique("category"),"كل المجالات")+'</select></div><div class="field"><label for="region">المنطقة</label><select id="region" class="control">'+optionList(unique("region"),"كل المناطق")+'</select></div><div class="field"><label for="district">الحي</label><select id="district" class="control">'+optionList(unique("district"),"كل الأحياء")+'</select></div><button id="clear" class="btn secondary">مسح الفلاتر</button></section><section class="stats"><div class="card stat"><div><div class="stat-label">الأنشطة المتاحة</div><div class="stat-value" id="totalStat">0</div></div><div class="stat-icon">◉</div></div><div class="card stat"><div><div class="stat-label">المجالات</div><div class="stat-value">'+unique("category").length+'</div></div><div class="stat-icon">⌘</div></div><div class="card stat"><div><div class="stat-label">المناطق</div><div class="stat-value">'+unique("region").length+'</div></div><div class="stat-icon">⌖</div></div></section><section class="card table-card"><div class="table-head"><div><div class="table-title">دليل الأنشطة</div><div class="table-hint">اللوكيشن يفتح رابط النشاط نفسه</div></div><div class="'+(editable?"upload":"hide")+'"><label for="csv">رفع ملف CSV</label><input id="csv" type="file" accept=".csv,text/csv"></div></div><div id="uploadMsg" class="notice" style="padding:0 20px"></div><div id="table"></div></section>';
      if(currentPage==="contacts") return '<section class="page-grid"><section class="card page-card"><h2>تسجيل تواصل جديد</h2><form id="contactForm" class="form-grid"><div class="field wide"><label for="contactLead">النشاط</label><select id="contactLead" name="lead_id" class="control"><option value="">تواصل يدوي / عميل غير مسجل</option>'+leads.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("")+'</select></div>'+formField("اسم النشاط أو العميل","contactName")+'<div class="field"><label for="contactChannel">وسيلة التواصل</label><select class="control" id="contactChannel" name="channel"><option value="whatsapp">واتساب</option><option value="phone">اتصال</option><option value="email">بريد</option><option value="visit">زيارة</option><option value="other">أخرى</option></select></div><div class="field"><label for="contactOutcome">النتيجة</label><select class="control" id="contactOutcome" name="outcome"><option value="contacted">تم التواصل</option><option value="replied">رد</option><option value="not_interested">غير مهتم</option><option value="follow_up">متابعة لاحقة</option><option value="no_answer">لم يرد</option><option value="converted">تحول لعميل</option><option value="other">أخرى</option></select></div>'+formField("موعد المتابعة","next_follow_up_at","date",false)+'<div class="field wide"><label for="contactNote">ملاحظاتك</label><textarea id="contactNote" name="note" class="control text-area"></textarea></div><div class="wide"><button class="btn">حفظ في سجل التواصل</button><div class="status-msg" id="pageMsg"></div></div></form></section><section class="card page-card"><h2>سجل التواصل</h2>'+logTable()+'</section></section>';
      if(currentPage==="clients") return '<section class="page-grid"><section class="card page-card"><h2>إضافة عميل يدويًا</h2><form id="clientForm" class="form-grid"><div class="field wide"><label for="clientLead">ربط بنشاط موجود (اختياري)</label><select class="control" id="clientLead" name="lead_id"><option value="">عميل جديد</option>'+leads.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("")+'</select></div>'+formField("اسم العميل / النشاط","clientName")+formField("رقم الجوال","clientPhone","tel",false)+formField("المبلغ","amount","number")+'<div class="field"><label for="currency">العملة</label><select class="control" id="currency" name="currency"><option value="SAR">ريال سعودي</option><option value="EGP">جنيه مصري</option></select></div><div class="field"><label for="basis">طريقة الدفع</label><select class="control" id="basis" name="payment_basis"><option value="project">بالمشروع</option><option value="monthly">شهري</option></select></div>'+formField("الباقة تشمل","package_details","text",false,true)+formField("بداية الاشتراك","subscription_start","date")+formField("نهاية الاشتراك","subscription_end","date",false)+'<div class="wide"><button class="btn">حفظ العميل</button><div class="status-msg" id="pageMsg"></div></div></form></section><section class="card page-card"><h2>العملاء النشطون والمتابعون</h2>'+clientTable()+'</section></section>';
      if(currentPage==="expenses") return '<section class="page-grid"><section class="card page-card"><h2>إضافة مصروف</h2><form id="expenseForm" class="form-grid">'+formField("المبلغ","expenseAmount","number")+'<div class="field"><label for="expenseCurrency">العملة</label><select id="expenseCurrency" name="currency" class="control"><option value="SAR">ريال سعودي</option><option value="EGP">جنيه مصري</option></select></div><div class="field"><label for="expenseCategory">نوع المصروف</label><select id="expenseCategory" name="category" class="control"><option>إنترنت</option><option>اشتراكات برامج</option><option>إعلانات</option><option>تنقلات</option><option>رواتب</option><option>أخرى</option></select></div>'+formField("التاريخ","expenseDate","date")+formField("التفاصيل","expenseDescription","text",false,true)+'<div class="wide"><button class="btn">حفظ المصروف</button><div class="status-msg" id="pageMsg"></div></div></form></section><section class="card page-card"><h2>قائمة المصروفات</h2>'+expenseTable()+'</section></section>';
      if(currentPage==="whatsapp") return '<section class="page-grid"><section class="card page-card"><h2>تسجيل موافقة التواصل</h2><p class="subtitle">افتح محادثة يدويًا فقط بعد وجود موافقة موثقة من جهة الاتصال.</p><form id="consentForm" class="form-grid"><div class="field wide"><label for="consentLead">النشاط</label><select class="control" id="consentLead" name="lead_id" required><option value="">اختر النشاط</option>'+leads.filter(x=>x.phone).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+" · "+esc(x.phone)+'</option>').join("")+'</select></div><div class="field"><label for="consentScope">نوع الموافقة</label><select class="control" id="consentScope" name="permission_scope"><option value="marketing">رسائل تسويقية</option><option value="service">رسائل خدمية</option></select></div>'+formField("مصدر الموافقة","consentSource")+formField("تفاصيل/إثبات الموافقة","consentEvidence","text",false,true)+'<div class="wide"><button class="btn">حفظ الموافقة</button><div class="status-msg" id="pageMsg"></div></div></form></section><section class="card page-card"><h2>قوالب الرسائل</h2><form id="templateForm" class="form-grid">'+formField("اسم القالب","templateName")+'<div class="field"><label for="templateCategory">التصنيف</label><select class="control" id="templateCategory" name="category"><option value="marketing">تسويقي</option><option value="service">خدمي</option></select></div>'+formField("اسم القالب المعتمد (اختياري)","providerName","text",false)+'<div class="field wide"><label for="templateBody">نص الرسالة</label><textarea class="control text-area" id="templateBody" name="body" required></textarea></div><div class="wide"><button class="btn secondary">حفظ القالب</button></div></form>'+templateTable()+'</section></section><section class="card page-card page-table"><h2>أرقام لديها موافقة مسجلة</h2>'+consentTable()+'</section><p class="fine">الإرسال يتم يدويًا بعد فتح واتساب. الإرسال الآلي يحتاج إعداد WhatsApp Business Platform وقوالب معتمدة وموافقة المستلمين.</p>';
      if(currentPage==="admin"&&profile.role==="admin") return '<section class="card page-card"><h2>إدارة صلاحيات المستخدمين</h2><p class="subtitle">إضافة حسابات جديدة تتم من Supabase Auth، ثم تظهر هنا لتحديد الصلاحية.</p>'+userTable()+'</section>';
      return '<section class="card empty">لا تملك صلاحية عرض هذه الصفحة.</section>';
    }
    async function openPage(page,notice=""){
      currentPage=page;
      try{
        if(page==="contacts") contactLogs=await request("/contact_logs?select=*&order=contacted_at.desc&limit=300")||[];
        if(page==="clients") clients=await request("/crm_clients?select=*&order=created_at.desc&limit=300")||[];
        if(page==="expenses") expenses=await request("/crm_expenses?select=*&order=occurred_on.desc&limit=300")||[];
        if(page==="whatsapp"){
          consents=await request("/whatsapp_consents?select=*&order=updated_at.desc&limit=500")||[];
          templates=await request("/whatsapp_templates?select=*&order=created_at.desc&limit=200")||[];
        }
        if(page==="admin"&&profile.role==="admin") users=await request("/profiles?select=id,email,role&order=created_at.asc&limit=300")||[];
        renderApp(); if(notice){const m=document.getElementById("pageMsg");if(m)m.textContent=notice;}
      }catch(err){renderApp();const m=document.getElementById("pageMsg");if(m)m.textContent="تعذر تحميل البيانات: "+err.message;}
    }
    function logTable(){return contactLogs.length?'<div class="table-wrap"><table><thead><tr><th>النشاط</th><th>الوسيلة</th><th>النتيجة</th><th>المتابعة</th><th>ملاحظات</th></tr></thead><tbody>'+contactLogs.map(x=>'<tr><td>'+esc(x.lead_name)+'</td><td>'+esc({whatsapp:"واتساب",phone:"اتصال",email:"بريد",visit:"زيارة",other:"أخرى"}[x.channel]||x.channel)+'</td><td>'+esc({contacted:"تم التواصل",replied:"رد",not_interested:"غير مهتم",follow_up:"متابعة",no_answer:"لم يرد",converted:"عميل",other:"أخرى"}[x.outcome]||x.outcome)+'</td><td>'+esc(x.next_follow_up_at||"—")+'</td><td>'+esc(x.note||"—")+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">لا يوجد تواصل مسجل حتى الآن.</div>';}
    function clientTable(){return clients.length?'<div class="table-wrap"><table><thead><tr><th>العميل</th><th>الجوال</th><th>الباقة</th><th>القيمة</th><th>طريقة الدفع</th><th>الاشتراك</th></tr></thead><tbody>'+clients.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone||"—")+'</td><td>'+esc(x.package_details||"—")+'</td><td>'+Number(x.amount||0).toLocaleString("ar")+' '+(x.currency==="EGP"?"ج.م":"ر.س")+'</td><td>'+ (x.payment_basis==="monthly"?"شهري":"بالمشروع")+'</td><td>'+esc(x.subscription_start||"—")+(x.subscription_end?" إلى "+esc(x.subscription_end):"")+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">لم تتم إضافة عملاء بعد.</div>';}
    function expenseTable(){return expenses.length?'<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>التفاصيل</th><th>المبلغ</th></tr></thead><tbody>'+expenses.map(x=>'<tr><td>'+esc(x.occurred_on)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description||"—")+'</td><td>'+Number(x.amount||0).toLocaleString("ar")+' '+(x.currency==="EGP"?"ج.م":"ر.س")+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">لم تتم إضافة مصروفات بعد.</div>';}
    function templateTable(){return templates.length?'<div class="page-table"><div class="table-wrap"><table><thead><tr><th>القالب</th><th>التصنيف</th><th>النص</th><th>حالة اعتماد واتساب</th></tr></thead><tbody>'+templates.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+ (x.category==="service"?"خدمي":"تسويقي")+'</td><td>'+esc(x.body)+'</td><td>'+esc(x.provider_approval_status||"غير مقدم")+'</td></tr>').join("")+'</tbody></table></div></div>':'<div class="empty">احفظ قالبًا لبدء الاستخدام.</div>';}
    function consentTable(){const active=consents.filter(x=>x.status==="granted");return active.length?'<div class="table-wrap"><table><thead><tr><th>النشاط</th><th>النطاق</th><th>الإثبات</th><th>إجراء يدوي</th></tr></thead><tbody>'+active.map(c=>{const lead=leads.find(l=>l.id===c.lead_id), matching=templates.filter(t=>t.is_active&&t.category===(c.permission_scope==="service"?"service":"marketing"));return '<tr><td>'+esc(lead?.name||c.phone)+'</td><td><span class="consent-badge">'+(c.permission_scope==="service"?"خدمي":"تسويقي")+'</span></td><td>'+esc([c.consent_source,c.evidence_note].filter(Boolean).join(" · ")||"موافقة مسجلة")+'</td><td><div class="table-actions">'+(matching.map(t=>'<button class="small-btn" data-send="'+esc(c.id)+'" data-template="'+esc(t.id)+'">فتح واتساب · '+esc(t.name)+'</button>').join("")||"لا يوجد قالب مطابق")+'<button class="small-btn danger" data-revoke="'+esc(c.id)+'">سحب الموافقة</button></div></td></tr>';}).join("")+'</tbody></table></div>':'<div class="empty">لا توجد موافقات نشطة. لا تفتح رسائل تسويقية دون موافقة موثقة.</div>';}
    function userTable(){return users.length?'<div class="table-wrap"><table><thead><tr><th>البريد</th><th>الصلاحية</th></tr></thead><tbody>'+users.map(u=>'<tr><td>'+esc(u.email||u.id)+'</td><td>'+(u.id===session.user.id?'<span class="consent-badge">مدير الحساب الحالي</span>':'<select class="control" data-role="'+esc(u.id)+'"><option value="viewer" '+(u.role==="viewer"?"selected":"")+'>مستخدم</option><option value="manager" '+(u.role==="manager"?"selected":"")+'>مدير بيانات</option><option value="admin" '+(u.role==="admin"?"selected":"")+'>مدير</option></select>')+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">لا توجد حسابات.</div>';}
    async function finishForm(form,message){form.reset();await openPage(currentPage,message);}
    async function saveContact(e){e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));const lead=leads.find(x=>x.id===d.lead_id);try{await request("/contact_logs",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({lead_id:d.lead_id||null,lead_name:d.contactName||lead?.name||"تواصل يدوي",channel:d.channel,outcome:d.outcome,next_follow_up_at:d.next_follow_up_at||null,note:d.note||null,created_by:session.user.id})});await finishForm(f,"تم حفظ التواصل في السجل.");}catch(err){document.getElementById("pageMsg").textContent=err.message;}}
    async function saveClient(e){e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));const lead=leads.find(x=>x.id===d.lead_id);try{await request("/crm_clients",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({lead_id:d.lead_id||null,name:d.clientName||lead?.name,phone:d.clientPhone||lead?.phone||null,amount:Number(d.amount),currency:d.currency,payment_basis:d.payment_basis,package_details:d.package_details||"",subscription_start:d.subscription_start,subscription_end:d.subscription_end||null,created_by:session.user.id})});await finishForm(f,"تمت إضافة العميل.");}catch(err){document.getElementById("pageMsg").textContent=err.message;}}
    async function saveExpense(e){e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));try{await request("/crm_expenses",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({amount:Number(d.expenseAmount),currency:d.currency,category:d.category,description:d.expenseDescription||null,occurred_on:d.expenseDate,created_by:session.user.id})});await finishForm(f,"تم حفظ المصروف.");}catch(err){document.getElementById("pageMsg").textContent=err.message;}}
    async function saveConsent(e){e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f)),lead=leads.find(x=>x.id===d.lead_id);try{await request("/whatsapp_consents",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({lead_id:lead.id,phone:lead.phone,permission_scope:d.permission_scope,status:"granted",consent_source:d.consentSource,evidence_note:d.consentEvidence||null,created_by:session.user.id})});await finishForm(f,"تم حفظ الموافقة وتوثيق مصدرها.");}catch(err){document.getElementById("pageMsg").textContent=err.message;}}
    async function saveTemplate(e){e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));try{await request("/whatsapp_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name:d.templateName,body:d.body,category:d.category,provider_template_name:d.providerName||null,created_by:session.user.id})});await finishForm(f,"تم حفظ القالب.");}catch(err){const m=document.getElementById("pageMsg");if(m)m.textContent=err.message;}}
    async function revokeConsent(id){if(!confirm("تأكيد سحب الموافقة؟"))return;try{await request("/whatsapp_consents?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:"revoked",revoked_at:new Date().toISOString()})});await openPage("whatsapp","تم سحب الموافقة.");}catch(err){alert(err.message);}}
    async function changeRole(id,role){try{await request("/profiles?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({role})});await openPage("admin","تم تحديث الصلاحية.");}catch(err){alert("تعذر تحديث الصلاحية: "+err.message);await openPage("admin");}}
    function saudiNumber(phone){let n=String(phone||"").replace(/\D/g,"");if(/^05\d{8}$/.test(n))n="966"+n.slice(1);else if(/^5\d{8}$/.test(n))n="966"+n;else if(n.startsWith("00"))n=n.slice(2);return n;}
    function openWhatsApp(consentId,templateId){const c=consents.find(x=>x.id===consentId),t=templates.find(x=>x.id===templateId),l=leads.find(x=>x.id===c?.lead_id);if(!c||c.status!=="granted"||!t||!l||t.category!==(c.permission_scope==="service"?"service":"marketing")){alert("لا توجد موافقة نشطة وقالب مناسب لهذا الرقم.");return;}const phone=saudiNumber(c.phone||l.phone),body=t.body.replace(/\{\{\s*name\s*\}\}/gi,l.name);if(!phone){alert("رقم الهاتف غير صالح.");return;}window.open("https://wa.me/"+encodeURIComponent(phone)+"?text="+encodeURIComponent(body),"_blank","noopener,noreferrer");}
    function drawTable() {
      const q=document.getElementById("q").value.trim().toLocaleLowerCase("ar"), category=document.getElementById("category").value, region=document.getElementById("region").value,district=document.getElementById("district").value;
      const rows=leads.filter(x=>(!q||[x.name,x.phone,x.address].some(v=>String(v||"").toLocaleLowerCase("ar").includes(q)))&&(!category||x.category===category)&&(!region||x.region===region)&&(!district||x.district===district));
      document.getElementById("totalStat").textContent=rows.length.toLocaleString("ar");
      if(!rows.length){document.getElementById("table").innerHTML='<div class="empty"><strong>لا توجد نتائج بعد</strong>عدّل الفلاتر أو أضف بيانات العملاء من ملف CSV.</div>';return;}
      document.getElementById("table").innerHTML='<div class="table-wrap"><table><thead><tr><th>النشاط</th><th>المجال</th><th>المنطقة والحي</th><th>التقييم</th><th>الهاتف</th><th>روابط التواصل</th></tr></thead><tbody>'+rows.map(x=>{
        const web=safeUrl(x.website_url),map=safeUrl(x.maps_url),digits=String(x.phone||"").replace(/\D/g,"");
        return '<tr><td><div class="biz">'+esc(x.name)+'</div><div class="muted">'+esc(x.address||"")+'</div></td><td>'+esc(x.category)+'</td><td>'+esc([x.region,x.district].filter(Boolean).join(" · ")||"—")+'</td><td><span class="rating">'+(x.google_rating?esc(x.google_rating)+" ★":"—")+'</span><div class="muted">'+(Number(x.review_count||0).toLocaleString("ar"))+' تقييم</div></td><td>'+esc(x.phone||"—")+'</td><td><div class="actions">'+(web?'<a class="icon-btn" href="'+esc(web)+'" target="_blank" rel="noopener noreferrer">الموقع</a>':"")+(map?'<a class="icon-btn map" href="'+esc(map)+'" target="_blank" rel="noopener noreferrer">الخريطة</a>':"")+(digits?'<a class="icon-btn" href="https://wa.me/'+esc(digits)+'" target="_blank" rel="noopener noreferrer">واتساب</a>':"")+'</div></td></tr>';
      }).join("")+'</tbody></table></div>';
    }
    function parseCsv(text) {
      const out=[];let row=[],cell="",quoted=false;
      for(let i=0;i<text.length;i++){const c=text[i];if(quoted&&c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=!quoted;else if(c===","&&!quoted){row.push(cell);cell="";}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell="";}else cell+=c;}
      row.push(cell);if(row.some(v=>v.trim()))out.push(row);return out;
    }
    function normHeader(v){return String(v||"").trim().toLowerCase().replace(/[\s_-]/g,"");}
    async function uploadCsv(e){
      const file=e.target.files?.[0];if(!file)return;const msg=document.getElementById("uploadMsg");
      try{
        const parsed=parseCsv((await file.text()).replace(/^\uFEFF/,""));if(parsed.length<2)throw new Error("الملف فارغ أو لا يحتوي صفوف بيانات.");
        const headers=parsed[0].map(normHeader), aliases={
          name:["name","businessname","اسم","الاسم","اسم النشاط","المنشأة","اسم المنشأة"],
          category:["category","sector","industry","المجال","التخصص","النشاط"],
          region:["region","area","المنطقة"],
          district:["district","neighborhood","حي","الحي"],
          address:["address","العنوان"],
          google_rating:["googlerating","rating","التقييم","تقييمجوجل"],
          review_count:["reviewcount","reviews","ratingscount","عددالتقييمات","عددالتقييم"],
          phone:["phone","telephone","mobile","رقمالهاتف","الهاتف","التليفون","رقمالتليفون"],
          website_url:["website","websiteurl","site","الموقعالالكتروني","الموقع"],
          maps_url:["maps","mapsurl","location","googlemaps","رابطالموقع","رابطالخريطة","الموقعالجغرافي"]
        };
        const col={};for(const key in aliases)col[key]=headers.findIndex(h=>aliases[key].map(normHeader).includes(h));
        if(col.name<0||col.category<0)throw new Error("تأكد من وجود عمودي الاسم والمجال في الملف.");
        const data=parsed.slice(1).map(r=>{const o={};for(const k in col)o[k]=col[k]<0?null:(r[col[k]]||"").trim()||null;o.google_rating=o.google_rating?Number(o.google_rating.replace(",",".")):null;o.review_count=o.review_count?parseInt(o.review_count.replace(/\D/g,""),10)||0:0;return o;}).filter(x=>x.name&&x.category);
        if(!data.length)throw new Error("لم أجد صفوفاً صالحة للإضافة.");let count=0;
        for(let i=0;i<data.length;i+=100){await request("/leads",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(data.slice(i,i+100))});count+=data.slice(i,i+100).length;}
        await loadLeads();renderApp();const m=document.getElementById("uploadMsg");if(m)m.textContent="تم استيراد "+count.toLocaleString("ar")+" سجل بنجاح.";
      }catch(err){msg.textContent=err.message;}
    }
    (async()=>{try{const saved=sessionStorage.getItem("tawasol_session");if(saved)session=JSON.parse(saved);if(session?.access_token){if(session.expires_at&&session.expires_at*1000<Date.now()){session=null;sessionStorage.removeItem("tawasol_session");loginView();}else await startApp();}else loginView();}catch{logout();}})();
  </script>
